when:
  - event: ["push", "pull_request"]
    branch: ["main"]

engine: nixery

dependencies:
  nixpkgs:
    - beam27packages.elixir_1_18
    - beam27packages.erlang

steps:
  - name: setup
    command: |
      mix local.hex --force
      mix local.rebar --force
      mix deps.get
  - name: unlock
    command: mix deps.unlock --all
  - name: install
    command: mix deps.get
  - name: compile
    command: mix compile --warnings-as-errors
  - name: test
    command: mix test --warnings-as-errors
